<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <title>Offline — Product Catalog</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        color: #18181b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #09090b;
          color: #fafafa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: 100%;
        max-width: 32rem;
        border: 1px solid #e4e4e7;
        border-radius: 0.75rem;
        padding: 3rem;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        main {
          border-color: #27272a;
        }
      }

      .icon {
        display: grid;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto;
        place-items: center;
        border-radius: 9999px;
        background: #f4f4f5;
        color: #71717a;
      }

      @media (prefers-color-scheme: dark) {
        .icon {
          background: #27272a;
          color: #a1a1aa;
        }
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.5rem;
        letter-spacing: -0.025em;
      }

      p {
        margin: 0.5rem 0 0;
        color: #71717a;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        p {
          color: #a1a1aa;
        }
      }

      button {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        height: 2.25rem;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #18181b;
        color: #fafafa;
        cursor: pointer;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0 0.75rem;
      }

      button:hover {
        background: #3f3f46;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      @media (prefers-color-scheme: dark) {
        button {
          background: #fafafa;
          color: #18181b;
        }

        button:hover {
          background: #d4d4d8;
        }
      }

      #status {
        min-height: 1.25rem;
        color: #dc2626;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>You’re offline</h1>
      <p>
        It looks like you’ve lost your internet connection. Cached pages may
        still work, but new content can’t be loaded until you reconnect.
      </p>
      <button id="retry" type="button">Retry Connection</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const retryButton = document.getElementById('retry')
      const statusMessage = document.getElementById('status')

      retryButton.addEventListener('click', async () => {
        retryButton.disabled = true
        retryButton.textContent = 'Checking connection…'
        statusMessage.textContent = ''

        try {
          const response = await fetch(
            `/manifest.webmanifest?ping=${Date.now()}`,
            { cache: 'no-store' },
          )

          if (!response.ok) {
            throw new Error(`Connectivity check failed with ${response.status}`)
          }

          window.location.reload()
        } catch {
          statusMessage.textContent =
            'Still offline. Check your connection and try again.'
          retryButton.disabled = false
          retryButton.textContent = 'Retry Connection'
        }
      })
    </script>
  </body>
</html>
